name: MAVIC Docker Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose without loading environment files
        run: docker compose --env-file /dev/null -f compose.yml config --quiet
      - name: Check Docker build definitions
        run: |
          docker build --check -f application/web/Dockerfile .
          docker build --check -f application/client-booking/Dockerfile .
          docker build --check -f application/api/Dockerfile .

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            label: MAVIC Admin
          - app: client-booking
            label: MAVIC Client Reservation
          - app: api
            label: MAVIC NestJS API
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: application/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: mavic-${{ matrix.app }}:ci
          build-args: |
            API_BASE_URL=http://api:4000
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Verify image files and runtime dependencies without starting the app
        env:
          APP: ${{ matrix.app }}
        shell: bash
        run: |
          if [ "$APP" = api ]; then
            docker run --rm --entrypoint node "mavic-$APP:ci" --input-type=module -e "
              import { accessSync } from 'node:fs';
              import { createRequire } from 'node:module';
              const require = createRequire(process.cwd() + '/package.json');
              accessSync('dist/main.js');
              for (const name of ['@nestjs/core', 'pg', 'argon2']) require(name);
              console.log('API artifact and runtime dependencies verified');
            "
          else
            docker run --rm --entrypoint node "mavic-$APP:ci" -e "
              const fs = require('node:fs');
              const root = 'application/$APP';
              for (const file of ['/server.js', '/.next/BUILD_ID', '/.next/static', '/public'])
                fs.accessSync(root + file);
              console.log('Next.js standalone artifacts verified');
            "
          fi


  test:
    name: API unit tests and type-safe build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install workspace dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Run API unit tests
        run: bun run --filter api test
      - name: Build API
        if: always() && steps.install.outcome == 'success'
        run: bun run --filter api build
      - name: Typecheck booking frontend
        if: always() && steps.install.outcome == 'success'
        run: bun run --filter client-booking typecheck
